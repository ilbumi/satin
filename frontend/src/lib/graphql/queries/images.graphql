query GetImages($pagination: PaginationInput, $sort: SortInput, $filter: ImageFilterInput) {
	images(pagination: $pagination, sort: $sort, filter: $filter) {
		items {
			id
			url
			width
			height
			ext
			status
			createdAt
			updatedAt
		}
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
		totalCount
	}
}

query GetImage($id: String!) {
	image(id: $id) {
		id
		url
		width
		height
		ext
		status
		createdAt
		updatedAt
	}
}

query GetImagesByStatus($statuses: [String!]!) {
	imagesByStatus(statuses: $statuses) {
		id
		url
		width
		height
		ext
		status
		createdAt
		updatedAt
	}
}
