query GetImages($pagination: PaginationInput, $sort: SortInput) {
	images(pagination: $pagination, sort: $sort) {
		items {
			id
			url
			status
			createdAt
			updatedAt
		}
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
		totalCount
	}
}

query GetImage($id: String!) {
	image(id: $id) {
		id
		url
		status
		createdAt
		updatedAt
	}
}

query GetImagesByStatus($statuses: [String!]!) {
	imagesByStatus(statuses: $statuses) {
		id
		url
		status
		createdAt
		updatedAt
	}
}
