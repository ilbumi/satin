query GetAnnotationsByImage($imageId: String!) {
	annotationsByImage(imageId: $imageId) {
		id
		imageId
		description
		tags
		confidence
		source
		boundingBox {
			x
			y
			width
			height
		}
		createdAt
		updatedAt
	}
}

query GetAnnotation($id: String!) {
	annotation(id: $id) {
		id
		imageId
		description
		tags
		confidence
		source
		boundingBox {
			x
			y
			width
			height
		}
		createdAt
		updatedAt
	}
}
