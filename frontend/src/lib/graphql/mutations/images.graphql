mutation CreateImage($input: ImageCreateInput!) {
	createImage(input: $input) {
		... on ImageSuccessResult {
			success
			message
			data {
				id
				url
				status
				createdAt
				updatedAt
			}
		}
		... on ValidationError {
			field
			message
		}
		... on OperationError {
			message
			details
		}
	}
}

mutation UpdateImage($id: String!, $input: ImageUpdateInput!) {
	updateImage(id: $id, input: $input) {
		... on ImageSuccessResult {
			success
			message
			data {
				id
				url
				status
				createdAt
				updatedAt
			}
		}
		... on ValidationError {
			field
			message
		}
		... on OperationError {
			message
			details
		}
		... on NotFoundError {
			id
			resource
			message
		}
	}
}

mutation DeleteImage($id: String!) {
	deleteImage(id: $id) {
		deleted
		message
	}
}
